name: IRCTC Benchmark CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * *'  # Daily 9 AM IST = 3:30 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  benchmark-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Stage 1 - Ingestion + Security Check
      run: python src/01_ingestion.py
      
    - name: Stage 2 - Chunking
      run: python src/02_chunking.py
      
    - name: Stage 3 - Embedding + Drift Check
      run: python src/03_embedding.py
      
    - name: Stage 4 - Vector Store Versioning
      run: python src/04_vector_store.py
      
    - name: Stage 5 - Retrieval + Context Relevancy
      run: python src/05_retrieval.py
      
    - name: Stage 6 - Generation + Tool Calling
      run: python src/06_generation.py
      
    - name: Stage 7 - Evaluation - RAG Triad + Safety
      run: python src/07_evaluation.py
      
    - name: Upload Benchmark Report
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-report
        path: logs/benchmark_daily.csv
        
    - name: Check Threshold - Fail if Groundedness <0.85
      run: |
        python -c "
        import pandas as pd
        df = pd.read_csv('logs/benchmark_daily.csv')
        avg_ground = df['groundedness'].mean()
        print(f'Avg Groundedness: {avg_ground}')
        if avg_ground < 0.85:
            print('FAIL: Hallucination detected!')
            exit(1)
        else:
            print('PASS: All good!')
        "